<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>

    <link rel="stylesheet" href="style.css"/>

</head>
<body>
    <header class="header">
    <p class="brand">Frame<span>.</span></p>
    <h1>Image Gallery</h1>
    <p class="subtitle">A collection of beautiful moments.</p>
  </header>

  <main class="gallery">
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Green mountain landscape" />
      <figcaption>Mountain Escape</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves and beach" />
      <figcaption>Ocean Breeze</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Lake surrounded by mountains" />
      <figcaption>Quiet Lake</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=900&q=80" alt="Wild deer in nature" />
      <figcaption>Wildlife</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest" />
      <figcaption>Forest Light</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="Blue sea and waves" />
      <figcaption>Blue Waves</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks" />
      <figcaption>Snowy Peaks</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise over a landscape" />
      <figcaption>Golden Sunrise</figcaption>
    </figure>
    <figure class="gallery-item">
      <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Beautiful nature valley" />
      <figcaption>Hidden Valley</figcaption>
    </figure>
  </main>

  <footer>© 2026 Frame Gallery</footer>
  
</body>
</html>
